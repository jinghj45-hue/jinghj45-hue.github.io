  <script src="works-data.js"></script>
  <script>
    // React Bits Shiny Text: default 120deg, 40% band, soft falloff,
    // cosine easing and a two-second left-to-right sweep; no React required.
    (() => {
      const text = document.querySelector('.showcase-cue .shiny-text');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const baseGradient = 'linear-gradient(#797979, #797979)';
      let frame = 0;
      let start = null;
      let visible = false;
      const draw = now => {
        if (start === null) start = now;
        const progress = ((now - start) % 2000) / 2000;
        const position = -22 + 144 * (0.5 - Math.cos(Math.PI * progress) / 2);
        const stops = [];
        for (const side of [-1, 1]) {
          for (const falloff of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
            const amount = falloff * falloff * (3 - 2 * falloff);
            const value = Math.round(Math.pow(Math.pow(121 / 255, 2.2) * (1 - amount) + amount, 1 / 2.2) * 255);
            stops.push([position + side * (4 + 16 * (1 - falloff)), value]);
          }
        }
        stops.sort((a, b) => a[0] - b[0]);
        text.style.backgroundImage = `linear-gradient(120deg, #797979 0%, ${stops.map(([at, value]) => `rgb(${value}, ${value}, ${value}) ${at.toFixed(2)}%`).join(', ')}, #797979 100%)`;
        frame = requestAnimationFrame(draw);
      };
      const sync = () => {
        cancelAnimationFrame(frame);
        frame = 0;
        start = null;
        text.style.backgroundImage = baseGradient;
        if (visible && !document.hidden && !reduceMotion.matches) frame = requestAnimationFrame(draw);
      };
      new IntersectionObserver(entries => { visible = entries.some(entry => entry.isIntersecting); sync(); }).observe(text);
      reduceMotion.addEventListener('change', sync);
      document.addEventListener('visibilitychange', sync);
    })();
    const stripOne = ['aiwonderland','2024zanhui','gonpai2.0','juguang','zhitou','shipinzanhui'];
    const stripTwo = ['xiaoqin','web3','tuitui','manju','honbao','chondian'];
    const works = window.portfolioWorks;
    const asset = window.portfolioAsset;
    const makeStrip = (id, items) => {
      const row = document.getElementById(id);
      [...items,...items,...items].forEach(name => {
        const image = document.createElement('img');
        image.loading = 'lazy'; image.decoding = 'async'; image.src = asset(name); image.alt = '';
        row.appendChild(image);
      });
    };
    makeStrip('marqueeFirst', stripOne);
    makeStrip('marqueeSecond', stripTwo);

    const grid = document.getElementById('works');
    const workCards = [];
    works.forEach(work => {
      const card = document.createElement('button');
      card.className = 'work-card'; card.type = 'button'; card.setAttribute('aria-label', `${work.title}，${work.year}`);
      const art = document.createElement('span'); art.className = 'card-art';
      const image = document.createElement('img'); image.src = asset(work.image); image.alt = ''; image.loading = 'lazy'; image.decoding = 'async';
      const caption = document.createElement('span'); caption.className = 'card-caption';
      const title = document.createElement('span'); title.className = 'title'; title.textContent = work.title;
      const year = document.createElement('span'); year.className = 'year'; year.textContent = work.year;
      const tags = document.createElement('span'); tags.className = 'card-tags';
      const borderGlow = document.createElement('span'); borderGlow.className = 'card-border-glow'; borderGlow.setAttribute('aria-hidden', 'true');
      const edgeLight = document.createElement('span'); edgeLight.className = 'card-edge-light'; edgeLight.setAttribute('aria-hidden', 'true');
      const moreSlot = document.createElement('span'); moreSlot.className = 'card-more-slot'; moreSlot.setAttribute('aria-hidden', 'true');
      const viewMore = document.createElement('span'); viewMore.className = 'card-view-more'; viewMore.setAttribute('aria-hidden', 'true');
      const viewMoreText = document.createElement('span'); viewMoreText.textContent = 'View More';
      const viewMoreIcon = document.createElement('img'); viewMoreIcon.className = 'card-view-more-icon'; viewMoreIcon.src = 'assets/icon_more.webp'; viewMoreIcon.alt = '';
      work.tags.forEach(label => { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = label; tags.appendChild(tag); });
      viewMore.append(viewMoreText, viewMoreIcon);
      moreSlot.appendChild(viewMore);
      caption.append(title, year); art.append(image, caption); card.append(art, tags, moreSlot, borderGlow, edgeLight); workCards.push(card);
      // Use the official normalized edge proximity and cursor angle calculations.
      // Re-read bounds during hover so the light follows the expanding button area.
      let glowFrame = 0;
      let glowPointer = null;
      const renderCardGlow = () => {
        if (!glowPointer) return;
        const rect = card.getBoundingClientRect();
        const cx = rect.width / 2, cy = rect.height / 2;
        const dx = glowPointer.x - rect.left - cx;
        const dy = glowPointer.y - rect.top - cy;
        const edge = Math.min(1, Math.max(Math.abs(dx) / cx, Math.abs(dy) / cy));
        const angle = (Math.atan2(dy, dx) * 180 / Math.PI + 450) % 360;
        card.style.setProperty('--edge-proximity', (edge * 100).toFixed(3));
        card.style.setProperty('--cursor-angle', `${angle.toFixed(3)}deg`);
        glowFrame = requestAnimationFrame(renderCardGlow);
      };
      const trackCardGlow = event => {
        if (event.pointerType === 'touch') return;
        glowPointer = {x: event.clientX, y: event.clientY};
        if (!glowFrame) glowFrame = requestAnimationFrame(renderCardGlow);
      };
      const clearCardGlow = () => {
        cancelAnimationFrame(glowFrame); glowFrame = 0; glowPointer = null;
        card.style.setProperty('--edge-proximity', '0');
      };
      card.addEventListener('pointerenter', trackCardGlow, {passive: true});
      card.addEventListener('pointermove', trackCardGlow, {passive: true});
      card.addEventListener('pointerleave', clearCardGlow, {passive: true});
      card.addEventListener('pointercancel', clearCardGlow, {passive: true});
      card.addEventListener('click', () => {
        location.href = `project.html?work=${encodeURIComponent(work.image)}`;
      });
    });
    // Separate columns let an expanded card push only the works below it.
    const mobileWorks = window.matchMedia('(max-width: 767px)');
    const arrangeWorks = () => {
      const columnCount = 2;
      const columns = Array.from({length: columnCount}, () => {
        const column = document.createElement('div'); column.className = 'works-column'; return column;
      });
      workCards.forEach((card, index) => columns[index % columnCount].appendChild(card));
      grid.replaceChildren(...columns);
    };
    arrangeWorks(); mobileWorks.addEventListener('change', arrangeWorks);
    // Expand eight pixels on each side. Reserve the scaled height so the
    // visible gap to neighbouring cards stays eight pixels, even while open.
    const cardSizeObserver = new ResizeObserver(entries => {
      for (const {target: card} of entries) {
        const width = card.offsetWidth;
        if (!width) continue;
        const growth = 16 / width;
        card.style.setProperty('--card-hover-scale', String(1 + growth));
        card.style.setProperty('--card-hover-extra', `${card.offsetHeight * growth}px`);
      }
    });
    workCards.forEach(card => cardSizeObserver.observe(card));
    // Keep the footer below the taller column, including expanded hover cards.
    const contactFooter = document.querySelector('.contact-footer');
    const syncWorksHeight = () => {
      if (mobileWorks.matches) {
        contactFooter.style.removeProperty('top');
        return;
      }
      const footerTop = grid.offsetTop + grid.offsetHeight + 68;
      contactFooter.style.top = `${footerTop}px`;
      document.documentElement.style.setProperty('--page-height', `${footerTop + 220}px`);
    };
    new ResizeObserver(syncWorksHeight).observe(grid);
    mobileWorks.addEventListener('change', syncWorksHeight);
    syncWorksHeight();

    const setStageScale = () => {
      document.documentElement.style.setProperty('--stage-scale', window.innerWidth < 768 ? 1 : Math.min(1, window.innerWidth / 1920));
    };
    setStageScale(); window.addEventListener('resize', setStageScale, {passive:true});

    const scene = document.querySelector('.hero-scene');
    const objects = [...scene.querySelectorAll('.scene-object')];
    const spotlight = scene.querySelector('.scene-spotlight');
    const positionSpotlight = (clientX, clientY) => {
      const bounds = scene.getBoundingClientRect();
      const scale = bounds.width / 1920;
      const x = (clientX - bounds.left) / scale - 310;
      const y = (clientY - bounds.top) / scale;
      spotlight.style.setProperty('--spot-x', `${Math.max(0, Math.min(1300, x)).toFixed(1)}px`);
      spotlight.style.setProperty('--spot-y', `${Math.max(0, Math.min(740, y)).toFixed(1)}px`);
    };
    let frame = 0;
    scene.addEventListener('pointermove', event => {
      positionSpotlight(event.clientX, event.clientY);
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const sceneBounds = scene.getBoundingClientRect();
      const sx = (event.clientX - sceneBounds.left) / sceneBounds.width * 1920;
      const sy = (event.clientY - sceneBounds.top) / sceneBounds.width * 1920;
      if (scene.classList.contains('software-open') && (sx < 1370 || sx > 1610 || sy < 375 || sy > 610)) {
        scene.classList.remove('software-open','spotlit');
        objects.forEach(item => item.classList.remove('is-hovered'));
      }
      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const bounds = scene.getBoundingClientRect();
        const nx = (event.clientX - bounds.left) / bounds.width - .5;
        const ny = (event.clientY - bounds.top) / bounds.height - .5;
        objects.forEach((item, index) => {
          const depth = item.classList.contains('software-icon') ? 9 : (index === 0 ? 5 : 7);
          item.style.setProperty('--tx', `${(nx * depth).toFixed(2)}px`);
          item.style.setProperty('--ty', `${(ny * depth).toFixed(2)}px`);
        });
      });
    });
    scene.addEventListener('pointerleave', () => {
      objects.forEach(item => { item.style.setProperty('--tx','0px'); item.style.setProperty('--ty','0px'); });
      objects.forEach(item => item.classList.remove('is-hovered'));
      scene.classList.remove('spotlit','software-open');
    });
    objects.forEach(item => {
      item.addEventListener('pointerenter', event => {
        positionSpotlight(event.clientX, event.clientY);
        objects.forEach(other => other.classList.remove('is-hovered'));
        item.classList.add('is-hovered');
        scene.classList.add('spotlit');
        if (item.classList.contains('software-icon')) {
          scene.classList.add('software-open');
        } else {
          scene.classList.remove('software-open');
        }
      });
      item.addEventListener('pointerleave', () => {
        item.classList.remove('is-hovered');
        if (!item.classList.contains('software-icon')) scene.classList.remove('spotlit');
      });
    });

    const resumeButton = document.getElementById('resumeButton');
    const specularSettings = { intensity: 1, idleIntensity: .35, shineSize: 10, shineFade: 34, proximity: 250, followMouse: true };
    let specularAngle = 2.4, specularTarget = 2.4, specularStrength = specularSettings.idleIntensity, specularFrame = 0;
    const updateSpecularButton = () => {
      specularFrame = 0;
      const smoothAngle = ((specularTarget - specularAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      specularAngle += smoothAngle * .18;
      resumeButton.style.setProperty('--sb-angle', `${specularAngle}rad`);
      resumeButton.style.setProperty('--sb-intensity', specularStrength.toFixed(3));
    };
    window.addEventListener('pointermove', event => {
      if (!specularSettings.followMouse || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const box = resumeButton.getBoundingClientRect();
      const dx = Math.max(box.left - event.clientX, 0, event.clientX - box.right);
      const dy = Math.max(box.top - event.clientY, 0, event.clientY - box.bottom);
      const distance = Math.hypot(dx, dy);
      const close = Math.max(0, 1 - distance / specularSettings.proximity);
      const eased = close * close * (3 - 2 * close);
      const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
      if (distance === 0) {
        const nx = (event.clientX - cx) / (box.width / 2);
        const ny = (cy - event.clientY) / (box.height / 2);
        specularTarget = Math.atan2(2 / box.height, -2 / box.width) + nx * .3 + ny * .15;
      } else {
        specularTarget = Math.atan2(cy - event.clientY, event.clientX - cx);
      }
      specularStrength = specularSettings.idleIntensity + (specularSettings.intensity - specularSettings.idleIntensity) * eased;
      if (!specularFrame) specularFrame = requestAnimationFrame(updateSpecularButton);
    }, {passive:true});

  </script>
